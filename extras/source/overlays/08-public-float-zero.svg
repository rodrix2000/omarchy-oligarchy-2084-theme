<svg xmlns="http://www.w3.org/2000/svg" width="3840" height="2160" viewBox="0 0 3840 2160">
  <defs>
    <style>
      .display{font-family:'Nimbus Sans Narrow',sans-serif;font-weight:700;letter-spacing:4px}
      .mono{font-family:'JetBrains Mono',monospace;font-weight:600;letter-spacing:2px}
    </style>
    <pattern id="scan" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="1" fill="#eaf2f7" opacity=".12"/></pattern>
  </defs>
  <g transform="translate(320 1245) rotate(-5 570 245) skewX(7)">
    <rect width="1150" height="490" rx="18" fill="#070a12" opacity=".42"/>
    <rect width="1150" height="490" rx="18" fill="url(#scan)" opacity=".22"/>
    <text class="mono" x="74" y="82" font-size="18" fill="#4bd6d2">OWNERSHIP REGISTRY // PUBLIC TERMINAL</text>
    <rect x="74" y="112" width="880" height="3" fill="#4bd6d2"/>
    <text class="display" x="74" y="222" font-size="72" fill="#eaf2f7">PUBLIC FLOAT</text>
    <text class="display" x="720" y="222" font-size="82" fill="#9a77e8">0.00%</text>
    <text class="mono" x="74" y="310" font-size="19" fill="#eaf2f7">OWNERSHIP IS OPEN.</text>
    <text class="mono" x="74" y="356" font-size="19" fill="#e6b75a">TO CURRENT OWNERS.</text>
    <text class="mono" x="74" y="428" font-size="15" fill="#6f7f96">SYSTEM VISIBILITY: PUBLIC // CONTROL: RETAINED</text>
  </g>
</svg>
