    <ellipse cx="512" cy="512" rx="352" ry="128" transform="rotate(22 512 512)" stroke="url(#orbit)" stroke-width="3" opacity="0.7"/>
    <circle cx="512" cy="512" r="310" stroke="#EAF2F7" stroke-width="18" opacity="0.92"/>
    <circle cx="512" cy="512" r="277" stroke="#4BD6D2" stroke-width="3" opacity="0.42"/>
  </g>
  <path d="M512 296 704 488 656 536H368l-48-48Z" fill="url(#control)" filter="url(#soft-glow)"/>
  <path d="M368 552h288l48 48-192 192-192-192Z" fill="none" stroke="#EAF2F7" stroke-width="22" stroke-linejoin="round"/>
  <path d="M608 552h48l48 48-32 32-64-64Z" fill="#070A12"/>
  <path d="M344 536h336" stroke="#04060B" stroke-width="16" stroke-linecap="round"/>
