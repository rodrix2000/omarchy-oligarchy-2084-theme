<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Shareholder Republic split governance diamond</title>
  <desc id="desc">A public circular system surrounds a split diamond with an open lower share and a filled upper controlling share.</desc>
  <defs>
    <linearGradient id="control" x1="320" y1="300" x2="704" y2="580" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4BD6D2"/>
      <stop offset="0.55" stop-color="#6C8CFF"/>
      <stop offset="1" stop-color="#9A77E8"/>
    </linearGradient>
    <linearGradient id="orbit" x1="128" y1="512" x2="896" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4BD6D2" stop-opacity="0"/>
      <stop offset="0.25" stop-color="#4BD6D2" stop-opacity="0.75"/>
      <stop offset="0.75" stop-color="#9A77E8" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#9A77E8" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
